databaseChangeLog:
  - changeSet:
      id: 001-create-correction-tasks
      author: error-free-text
      changes:
        - createTable:
            tableName: correction_tasks
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source_text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: language
                  type: VARCHAR(2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: corrected_text
                  type: TEXT
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addCheckConstraint:
            tableName: correction_tasks
            constraintName: chk_task_language
            checkConstraint: language IN ('RU', 'EN')
        - addCheckConstraint:
            tableName: correction_tasks
            constraintName: chk_task_status
            checkConstraint: status IN ('NEW', 'IN_PROGRESS', 'COMPLETED', 'FAILED')
        - createIndex:
            tableName: correction_tasks
            indexName: idx_tasks_status
            columns:
              - column:
                  name: status
