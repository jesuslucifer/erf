spring:
  application:
    name: error-free-text
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/error_free_text}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

yandex:
  speller:
    base-url: ${YANDEX_SPELLER_BASE_URL:https://speller.yandex.net/services/spellservice.json}
    connect-timeout-ms: ${YANDEX_SPELLER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${YANDEX_SPELLER_READ_TIMEOUT_MS:5000}

scheduler:
  fixed-delay-ms: ${SCHEDULER_FIXED_DELAY_MS:5000}

logging:
  level:
    ru.errorfreetext: INFO
